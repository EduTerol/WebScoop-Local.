name: Nissan Sketchfab - Diagnostico Fallback V5

on:
  workflow_dispatch:

jobs:
  diagnosticar:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Preparar Chromium y Node
        uses: actions/setup-node@v4
        with:
          node-version: '26'

      - name: Instalar navegador y dependencias
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y chromium >/dev/null
          npm install --no-save --no-audit --no-fund puppeteer-core@24
          mkdir -p resultado

      - name: Investigar inicializacion y fallback
        run: |
          cat > diagnostico.cjs <<'JS'
          const fs=require('fs');
          const puppeteer=require('puppeteer-core');
          const ID='0875adba1a2444ef8699037c4dc6de09';
          const out='resultado';
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          const report={id:ID,started:new Date().toISOString(),responses:[],console:[],errors:[],frames:[],snapshots:[]};
          const relevant=url=>/fallback|browser-support|\/i\/models\/|\/models\/|model_file|archives|gltf|texture/i.test(url);
          const safeName=s=>s.replace(/[^a-z0-9_-]/gi,'_').slice(0,70);
          async function main(){
            const browser=await puppeteer.launch({executablePath:'/usr/bin/chromium',headless:true,args:[
              '--no-sandbox','--disable-dev-shm-usage','--enable-webgl',
              '--enable-unsafe-swiftshader','--use-gl=angle','--use-angle=swiftshader',
              '--ignore-gpu-blocklist'
            ]});
            try {
              const page=await browser.newPage();
              await page.setViewport({width:1440,height:900});
              page.on('console',m=>{if(report.console.length<100)report.console.push({type:m.type(),text:m.text().slice(0,700)});});
              page.on('pageerror',e=>{if(report.errors.length<100)report.errors.push(String(e.stack||e).slice(0,1500));});
              page.on('requestfailed',r=>{if(report.errors.length<100)report.errors.push('REQUEST '+r.url()+' '+r.failure()?.errorText);});
              page.on('framenavigated',f=>{if(report.frames.length<100)report.frames.push({url:f.url(),time:new Date().toISOString()});});
              page.on('response',res=>{
                const task=(async()=>{
                  const url=res.url();
                  if(!relevant(url))return;
                  const headers=res.headers();
                  const entry={url,status:res.status(),mime:headers['content-type']||'',length:headers['content-length']||'',time:new Date().toISOString()};
                  report.responses.push(entry);
                  if(/fallback|browser-support/i.test(url)){
                    try {
                      const body=await res.buffer();
                      const text=body.subarray(0,100000).toString('utf8');
                      entry.bodySample=text.slice(0,12000);
                      const file=safeName('response_'+report.responses.length)+'_'+safeName(new URL(url).pathname)+'.txt';
                      fs.writeFileSync(`${out}/${file}`,text);
                    }catch(e){entry.readError=String(e);}
                  }
                })();
                tasks.add(task);task.finally(()=>tasks.delete(task));
              });
              const url=`https://sketchfab.com/models/${ID}/embed?autostart=1`;
              await page.goto(url,{waitUntil:'domcontentloaded',timeout:60000});
              for(const sec of [8,20,40]){
                await sleep((sec-(report.snapshots.at(-1)?.second||0))*1000);
                const frames=page.frames();
                const snap={second:sec,frameUrls:frames.map(f=>f.url()),texts:[]};
                for(const frame of frames.slice(0,5)){
                  try{snap.texts.push({url:frame.url(),text:await frame.evaluate(()=>document.body?.innerText?.slice(0,1000)||'')});}
                  catch(e){snap.texts.push({url:frame.url(),error:String(e)});}
                }
                report.snapshots.push(snap);
                await page.screenshot({path:`${out}/visor-${sec}s.png`}).catch(()=>{});
                fs.writeFileSync(`${out}/informe.json`,JSON.stringify(report,null,2));
              }
              await Promise.allSettled([...tasks]);
            }finally{await browser.close();}
          }
          const tasks=new Set();
          main().catch(e=>{report.fatalError=String(e.stack||e);process.exitCode=1;})
            .finally(()=>{report.finished=new Date().toISOString();fs.writeFileSync(`${out}/informe.json`,JSON.stringify(report,null,2));console.log('Respuestas relevantes:',report.responses.length,'errores:',report.errors.length);});
          JS
          timeout 110s node diagnostico.cjs

      - name: Empaquetar informe
        if: always()
        run: |
          mkdir -p resultado
          tar -czf nissan-fallback-v5.tar.gz resultado

      - name: Subir artefacto
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nissan-fallback-v5
          path: nissan-fallback-v5.tar.gz
          retention-days: 7
          compression-level: 0
