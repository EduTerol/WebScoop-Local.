name: Probar Nissan GTS14 Sketchfab

on:
  workflow_dispatch:

jobs:
  inspeccionar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Consultar ficha y disponibilidad oficial
        shell: bash
        run: |
          mkdir -p resultado
          cat > consultar.py <<'PY'
          import json, os, urllib.request, urllib.error, datetime, re
          from urllib.parse import quote
          uid = '0875adba1a2444ef8699037c4dc6de09'
          page = f'https://sketchfab.com/3d-models/nissan-gts14-drift-{uid}'
          urls = {
              'modelo_api': f'https://api.sketchfab.com/v3/models/{uid}',
              'oembed': f'https://sketchfab.com/oembed?url={quote(page, safe="")}',
              'pagina': page,
          }
          os.makedirs('resultado', exist_ok=True)
          report = {'model_id':uid,'url':page,'fecha_utc':datetime.datetime.now(datetime.timezone.utc).isoformat(),'consultas':{}}
          headers = {'User-Agent':'Mozilla/5.0 (compatible; ModelAvailabilityCheck/1.0)', 'Accept':'application/json,text/html;q=0.9,*/*;q=0.8'}
          for name,url in urls.items():
              entry = {'url':url}
              try:
                  req = urllib.request.Request(url,headers=headers)
                  with urllib.request.urlopen(req,timeout=30) as res:
                      data = res.read(2_000_000)
                      entry['http_status'] = res.status
                      entry['content_type'] = res.headers.get('Content-Type','')
                      if name == 'pagina':
                          html = data.decode('utf-8','replace')
                          entry['titulo'] = (re.search(r'<title[^>]*>(.*?)</title>',html,re.I|re.S).group(1).strip() if re.search(r'<title[^>]*>(.*?)</title>',html,re.I|re.S) else None)
                          entry['html_bytes'] = len(data)
                      else:
                          try:
                              obj = json.loads(data)
                              with open('resultado/'+name+'.json','w',encoding='utf-8') as f: json.dump(obj,f,ensure_ascii=False,indent=2)
                              if name == 'modelo_api':
                                  entry['nombre'] = obj.get('name')
                                  entry['descargable'] = obj.get('isDownloadable')
                                  entry['licencia'] = obj.get('license')
                                  entry['poligonos'] = obj.get('faceCount')
                                  entry['vertices'] = obj.get('vertexCount')
                                  entry['formatos_api'] = obj.get('archives')
                              else:
                                  entry['titulo'] = obj.get('title')
                          except ValueError:
                              entry['respuesta_no_json'] = data[:300].decode('utf-8','replace')
              except urllib.error.HTTPError as e:
                  entry['http_status'] = e.code
                  entry['error'] = str(e)
              except Exception as e:
                  entry['error'] = repr(e)
              report['consultas'][name] = entry
              print(name, json.dumps(entry,ensure_ascii=False))
          report['conclusion'] = ('La API indica que el autor permite la descarga. Para obtener el archivo oficial puede requerirse autenticacion en Sketchfab.' if report['consultas'].get('modelo_api',{}).get('descargable') is True else 'No se ha confirmado permiso de descarga del modelo; no se han intentado extraer archivos del visor.')
          with open('resultado/informe.json','w',encoding='utf-8') as f: json.dump(report,f,ensure_ascii=False,indent=2)
          with open('resultado/LEEME.txt','w',encoding='utf-8') as f: f.write('Prueba de disponibilidad del modelo Nissan GTS14 en Sketchfab.\nNo descarga ni extrae geometria del visor.\nRevisa informe.json y modelo_api.json.\n')
          PY
          python3 consultar.py
      - name: Subir informe
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: informe-nissan-sketchfab
          path: resultado/
          if-no-files-found: warn
          retention-days: 7
