name: Capturar catalogo completo Deadly Minis

on:
  workflow_dispatch:

jobs:
  capturar:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Instalar Node 26
        uses: actions/setup-node@v4
        with:
          node-version: '26'

      - name: Instalar Chromium
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y chromium

      - name: Preparar capturador
        run: |
          git clone --depth 1 https://github.com/MIDILLI-Tech/WebScoop.git webscoop
          cd webscoop
          npm ci --ignore-scripts --no-audit
          cat > capture-all.cjs <<'JAVASCRIPT'
          const puppeteer = require('puppeteer-core');
          const fs = require('fs');
          const path = require('path');
          const crypto = require('crypto');
          const out = path.resolve('../deadlyminis-catalogo');
          fs.mkdirSync(path.join(out, 'recursos'), {recursive:true});
          fs.mkdirSync(path.join(out, 'paginas'), {recursive:true});
          const inventory = {started:new Date().toISOString(), characters:[], resources:[], errors:[]};
          const seen = new Set();
          const pending = new Set();
          let totalBytes = 0;
          const allowed = u => {
            try {
              const h = new URL(u).hostname;
              return h === 'deadlyminis.com' || h.endsWith('.deadlyminis.com') || h === 'cdn.shopify.com';
            } catch { return false; }
          };
          function track(p) { pending.add(p); p.finally(()=>pending.delete(p)); }
          (async () => {
          const browser = await puppeteer.launch({
            executablePath:'/usr/bin/chromium',
            headless:true,
            args:['--no-sandbox','--disable-dev-shm-usage']
          });
          try {
            const page = await browser.newPage();
            await page.setViewport({width:1440,height:900});
            page.on('response', response => {
              const job = (async () => {
                const url=response.url();
                if (!allowed(url) || seen.has(url)) return;
                seen.add(url);
                const status=response.status();
                const headers=response.headers();
                const mime=(headers['content-type']||'').split(';')[0];
                const item={url,status,mime};
                inventory.resources.push(item);
                if(status < 200 || status >= 300) return;
                const length=Number(headers['content-length']||0);
                if(length>30*1024*1024 || totalBytes>800*1024*1024) {item.skipped='size limit';return;}
                try {
                  const body=await response.buffer();
                  if(body.length>30*1024*1024 || totalBytes+body.length>800*1024*1024) {
                    item.skipped='size limit';return;
                  }
                  const ext=path.extname(new URL(url).pathname).slice(0,12) || (
                    mime.includes('javascript')?'.js':mime.includes('html')?'.html':mime.includes('json')?'.json':'.bin'
                  );
                  const file=crypto.createHash('sha256').update(url).digest('hex').slice(0,24)+ext;
                  fs.writeFileSync(path.join(out,'recursos',file),body);
                  totalBytes+=body.length;
                  item.file='recursos/'+file;
                  item.bytes=body.length;
                } catch(e) {item.error=String(e);}
              })();
              track(job);
            });
            await page.goto('https://deadlyminis.com/?model=vampire',{waitUntil:'domcontentloaded',timeout:90000});
            await new Promise(r=>setTimeout(r,5000));
            fs.writeFileSync(path.join(out,'paginas','inicio.html'),await page.content());
            const cards=await page.$$eval('[data-testid^="mini-card-"]',els=>els.map(e=>({
              id:e.getAttribute('data-testid').replace(/^mini-card-/,''),
              name:(e.innerText||'').trim()
            })));
            const unique=[...new Map(cards.map(c=>[c.id,c])).values()];
            console.log('Personajes detectados:',unique.length,unique.map(c=>c.id).join(', '));
            for(let i=0;i<unique.length;i++) {
              const c=unique[i];
              const record={...c,index:i+1};
              inventory.characters.push(record);
              try {
                const selector='[data-testid="mini-card-'+c.id+'"]';
                await page.waitForSelector(selector,{timeout:12000});
                await page.$eval(selector,el=>el.click());
                await new Promise(r=>setTimeout(r,2300));
                record.url=page.url();
                record.pageTitle=await page.title();
                record.modelRequests=inventory.resources.filter(r=>r.url.includes('/minis/')).map(r=>r.url).slice(-8);
                if(i<3 || i===unique.length-1)
                  await page.screenshot({path:path.join(out,'paginas',String(i+1).padStart(2,'0')+'-'+c.id+'.png')});
                console.log('['+(i+1)+'/'+unique.length+']',c.id,record.modelRequests.slice(-1)[0]||'sin modelo detectado');
              } catch(e) {record.error=String(e);inventory.errors.push({character:c.id,error:String(e)});}
              fs.writeFileSync(path.join(out,'inventario.json'),JSON.stringify(inventory,null,2));
            }
            await Promise.allSettled([...pending]);
          } finally {
            inventory.finished=new Date().toISOString();
            inventory.totalBytes=totalBytes;
            fs.writeFileSync(path.join(out,'inventario.json'),JSON.stringify(inventory,null,2));
            await browser.close();
          }
          })().catch(e=>{console.error(e);process.exitCode=1;});
          JAVASCRIPT

      - name: Capturar todos los personajes
        working-directory: webscoop
        run: node capture-all.cjs

      - name: Resumen de archivos
        if: always()
        run: |
          du -sh deadlyminis-catalogo 2>/dev/null || true
          test -f deadlyminis-catalogo/inventario.json && python3 -c 'import json; x=json.load(open("deadlyminis-catalogo/inventario.json")); print("Personajes:",len(x["characters"]),"Recursos:",len(x["resources"]),"Errores:",len(x["errors"]))' || true

      - name: Empaquetar captura
        if: always()
        run: |
          mkdir -p deadlyminis-catalogo
          tar -czf deadlyminis-catalogo-completo.tar.gz deadlyminis-catalogo

      - name: Publicar paquete
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deadlyminis-catalogo-completo
          path: deadlyminis-catalogo-completo.tar.gz
          retention-days: 7
          compression-level: 0
